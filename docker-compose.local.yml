services:
  postgres:
    image: postgres:18-alpine
    container_name: myownlink-postgres
    environment:
      POSTGRES_USER: myownlink
      POSTGRES_PASSWORD: password
      POSTGRES_DB: myownlink_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myownlink -d myownlink_development"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
